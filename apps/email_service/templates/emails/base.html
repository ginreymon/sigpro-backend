<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIGPRO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:20px 32px;background-color:#1f3a5f;border-radius:8px 8px 0 0;color:#ffffff;font-size:20px;font-weight:bold;">
              {% block header %}SIGPRO{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:32px;font-size:15px;line-height:1.5;color:#1f2937;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
              {% block footer %}Este es un mensaje automático de SIGPRO. Por favor no responda a este correo.{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
